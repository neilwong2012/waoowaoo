services:
  codex-bridge:
    build:
      context: ./integrations/codex
    image: waoowaoo-codex-bridge:local
    container_name: waoowaoo-codex-bridge
    restart: unless-stopped
    environment:
      CODEX_AS_API_HOST: "0.0.0.0"
      CODEX_AS_API_PORT: "18080"
      CODEX_AS_API_MODEL: "gpt-5.6-sol"
      CODEX_AS_API_RESPONSES_LITE: "off"
      CODEX_AS_API_AUTH_PATH: "/root/.codex/auth.json"
    volumes:
      - "${WAOOWAOO_CODEX_CONFIG_DIR:-${HOME}/.codex}:/root/.codex"
    expose:
      - "18080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
